[package]
name = "mythic-forge-desktop"
version = "0.1.0"
description = "Mythic Forge desktop shell (Tauri 2 / WebView2)"
authors = ["Mythic Bharat Studios"]
edition = "2021"
publish = false

[lib]
name = "mythic_forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
